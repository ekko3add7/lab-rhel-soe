---
- name: Install SSSD packages (ldap)
  ansible.builtin.dnf:
    name:
      - sssd
      - sssd-ldap
      - openldap-clients
    state: present
  when: idm_provider == 'ldap'

- name: Install SSSD packages (ipa)
  ansible.builtin.dnf:
    name:
      - sssd
      - ipa-client
    state: present
  when: idm_provider == 'ipa'

- name: Fetch IdM CA certificate (ldap)
  ansible.builtin.get_url:
    url: "{{ idm_ca_cert_url }}"
    dest: "{{ idm_ca_cert_path }}"
    validate_certs: false
    mode: "0644"
  when: idm_provider == 'ldap'

- name: Deploy SSSD configuration
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: root
    mode: "0600"
  notify: restart sssd

- name: Enable and start SSSD
  ansible.builtin.systemd:
    name: sssd
    enabled: true
    state: started

- name: Configure NSS to use SSS
  ansible.builtin.command: authselect select sssd --force
  changed_when: true

- name: Verify LDAP connectivity
  ansible.builtin.command: >
    ldapsearch -x -H {{ idm_ldap_uri }}
    -b "{{ idm_base_dn }}"
    -s base "(objectclass=*)" namingContexts
  environment:
    LDAPTLS_CACERT: "{{ idm_ca_cert_path }}"
  register: ldap_test
  changed_when: false
  when: idm_provider == 'ldap'

- name: Display LDAP connectivity result
  ansible.builtin.debug:
    var: ldap_test.stdout_lines
  when: idm_provider == 'ldap'
